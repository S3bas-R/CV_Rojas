<!DOCTYPE html>
<!-- Declara HTML5. -->
<html lang="es">
<!-- Raíz del documento, idioma español. -->

<head>
    <!-- Metadatos: no visibles. -->
    <meta charset="UTF-8">
    <!-- Codificación para acentos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Responsive para móviles. -->
    <title>Parallax Avanzado como Totem</title>
    <!-- Título de la pestaña. -->
    <link rel="stylesheet" href="styles.css">
    <!-- Enlaza CSS. -->
</head>

<body>
    <!-- Contenido visible aquí. -->

    <!-- ==================== SECCIÓN 1: INTRO NORMAL ==================== -->
    <div class="section intro">
        <!-- Sección full-screen con texto intro. -->
        <h1 class="reveal">Bienvenido a mi Parallax Avanzado</h1>
        <!-- Título que se animará al scroll (clase 'reveal'). -->
        <p class="reveal">Scroll down para ver la magia multicapa.</p>
        <!-- Párrafo que aparece con fade. -->
    </div>

    <!-- ==================== SECCIÓN 2: PARALLAX MULTICAPA ==================== -->
    <div class="parallax-container">
        <!-- Contenedor principal para las capas parallax. -->
        
        <!-- Capa 1: Fondo lejano (cielo, se mueve MUY lento) -->
        <div class="parallax-layer sky">
            <!-- Imagen de fondo lejano. -->
        </div>
        
        <!-- Capa 2: Montañas medias (se mueve lento) -->
        <div class="parallax-layer mountains">
            <!-- Imagen media. -->
        </div>
        
        <!-- Capa 3: Foreground (árboles cerca, se mueve más rápido) -->
        <div class="parallax-layer foreground">
            <!-- Elemento cercano. -->
        </div>
        
        <!-- Contenido overlay (texto centrado) -->
        <div class="content reveal">
            <!-- Texto que aparece encima de las capas. -->
            <h2>¡Multicapa en Acción!</h2>
            <p>Las capas se mueven a velocidades diferentes. Como en Totem.</p>
        </div>
    </div>

    <!-- ==================== SECCIÓN 3: CONTENIDO ANIMADO ==================== -->
    <div class="section animated">
        <!-- Sección con elementos que se deslizan al scroll. -->
        <div class="slide-in">Elemento que desliza desde izquierda.</div>
        <div class="slide-in">Otro desde derecha.</div>
    </div>

    <!-- ==================== SECCIÓN 4: CIERRE ==================== -->
    <div class="section outro">
        <h1>Fin del Viaje</h1>
        <p>¡Personaliza esto!</p>
    </div>

    <!-- ==================== JAVASCRIPT PARA ANIMACIONES ==================== -->
    <script src="script.js"></script>
    <!-- Enlaza el JS al final del body para que cargue después del HTML. -->
</body>

</html>
