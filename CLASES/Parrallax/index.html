<!DOCTYPE html>
<!-- Esto declara que es un documento HTML5. Siempre va al inicio. -->
<html lang="es">
<!-- <html> es la raíz de la página. lang="es" indica idioma español (mejora accesibilidad y SEO). -->

<head>
    <!-- La sección <head> contiene metadatos, título, enlaces a CSS, etc. No se ve en la página. -->
    
    <meta charset="UTF-8">
    <!-- Define la codificación de caracteres. UTF-8 permite usar ñ, acentos, emojis, etc. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página se adapte a pantallas móviles. width=device-width = ancho del dispositivo. initial-scale=1.0 = zoom inicial 100%. -->

    <title>Efecto Parallax Simple</title>
    <!-- Título que aparece en la pestaña del navegador. -->

    <link rel="stylesheet" href="styles.css">
    <!-- Enlaza el archivo CSS externo. "rel" indica relación (hoja de estilo), "href" es la ruta del archivo. -->
</head>

<body>
    <!-- Todo el contenido visible de la página va aquí. -->

    <!-- ==================== SECCIÓN 1: Contenido normal ==================== -->
    <div class="section">
        <!-- <div> es un contenedor genérico. class="section" permite estilizarlo con CSS. -->
        
        <h1>Sección 1: Contenido Normal</h1>
        <!-- <h1> es un título grande (nivel 1). -->

        <p>Este es texto normal. Haz scroll hacia abajo para ver el efecto.</p>
        <!-- <p> es un párrafo de texto. -->
    </div>
    <!-- Cierra el div de la sección 1 -->

    <!-- ==================== SECCIÓN PARALLAX ==================== -->
    <div class="parallax">
        <!-- Este div tendrá el efecto parallax gracias al CSS. -->
        
        <div class="content">
            <!-- Div interno para el texto que estará encima del fondo parallax. -->
            
            <h2>Sección con Parallax</h2>
            <!-- Título nivel 2, más pequeño que h1. -->

            <p>El fondo se mueve más lento que este texto.</p>
            <!-- Texto explicativo. -->
        </div>
        <!-- Cierra .content -->
    </div>
    <!-- Cierra .parallax -->

    <!-- ==================== SECCIÓN 3: Más contenido ==================== -->
    <div class="section">
        <!-- Otra sección normal, igual que la primera. -->
        
        <h1>Sección 3: Más Contenido</h1>
        <p>Fin de la página. ¡Prueba el scroll!</p>
    </div>
    <!-- Cierra el div de la sección 3 -->
</body>
<!-- Cierra el cuerpo de la página -->

</html>
<!-- Cierra el documento HTML -->
