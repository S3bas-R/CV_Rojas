<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo con ::before y ::after</title>
  <style>
    body {
      background-color: #252525;
      font-family:'Times New Roman', Times, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      position: relative;
      width: 300px;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -10px;
      left: -10px;
      width: 50px;
      height: 50px;
      background-color: #ff6b6b;
      border-radius: 50%;
      z-index: -1;
    }

    .card::after {
      content: "";
      position: absolute;
      bottom: -10px;
      right: -10px;
      width: 50px;
      height: 50px;
      background-color: #4ecdc4;
      border-radius: 50%;
      z-index: -1;
    }

    .card h2 {
      margin: 0;
      color: #333;
    }

    .card p {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Bienvenido</h2>
    <p>Esta tarjeta tiene decoraciones con pseudoelementos.</p>
  </div>
</body>
</html>
